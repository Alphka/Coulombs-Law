<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="color-scheme" content="dark">
		<meta name="theme-color" content="#082032">
		<meta name="author" content="Kayo Souza">
		<meta name="description" content="Calculates the amount of force between two stationary and electrically charged particles.">
		<meta property="og:type" content="website">
		<meta property="og:locale" content="en_US">
		<meta property="og:site_name" content="Coulomb's Law">
		<meta property="og:title" content="Coulomb's Law">
		<meta property="og:description" content="Calculates the amount of force between two stationary and electrically charged particles.">
		<meta property="og:url" content="https://coulomb-law.vercel.app/">
		<link rel="canonical" href="https://coulomb-law.vercel.app/">
		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="manifest" href="/manifest.webmanifest">
		<title>Coulomb's Law</title>
		<link rel="stylesheet" href="./styles/main.scss">
		<script type="module" src="./scripts/main.ts"></script>
	</head>
	<body>
		<main>
			<header>
				<h1>Coulomb's Law</h1>
			</header>
			<noscript>
				<p class="notice">This website doesn't work with JavaScript disabled</p>
			</noscript>
			<div class="tool" hidden>
				<div class="constant">
					<label for="constant">Coulomb's constant</label>
					<p>
						<input id="constant" type="number" value="9" min="8.9" max="9" step="any" list="constants" inputmode="decimal" title="This field should only contain numbers and a point (.)">
						<span class="tex" data-tex="\mathsf{\times\ 10^9\ \dfrac{Nm^2}{C^2}}">&times; 10<sup>9</sup> N&middot;m<sup>2</sup>/C<sup>2</sup></span>
					</p>
					<datalist id="constants">
						<option value="8.998"></option>
						<option value="8.99"></option>
						<option value="8.9"></option>
						<option value="9"></option>
					</datalist>
				</div>
				<section class="calculator" aria-labelledby="calculator-title">
					<h2 id="calculator-title">Select what you want to calculate:</h2>
					<div role="tablist" aria-labelledby="calculator-title">
						<button type="button" role="tab" id="tab-force" aria-controls="force" aria-selected="true" tabindex="0">Force</button>
						<button type="button" role="tab" id="tab-charge" aria-controls="charge" aria-selected="false" tabindex="-1">Charge</button>
						<button type="button" role="tab" id="tab-distance" aria-controls="distance" aria-selected="false" tabindex="-1">Distance</button>
					</div>
					<div class="panels">
					<form id="force" role="tabpanel" aria-labelledby="tab-force" novalidate>
						<label>
							<span>First charge <span class="unit">(C)</span></span>
							<input type="text" name="charge1" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>Second charge <span class="unit">(C)</span></span>
							<input type="text" name="charge2" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>Distance <span class="unit">(m)</span></span>
							<input type="text" name="distance" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<button type="submit">Submit</button>
					</form>
					<form id="charge" role="tabpanel" aria-labelledby="tab-charge" novalidate hidden>
						<label>
							<span>Force <span class="unit">(N)</span></span>
							<input type="text" name="force" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>Second charge <span class="unit">(C)</span></span>
							<input type="text" name="charge2" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>Distance <span class="unit">(m)</span></span>
							<input type="text" name="distance" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<button type="submit">Submit</button>
					</form>
					<form id="distance" role="tabpanel" aria-labelledby="tab-distance" novalidate hidden>
						<label>
							<span>Force <span class="unit">(N)</span></span>
							<input type="text" name="force" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>First charge <span class="unit">(C)</span></span>
							<input type="text" name="charge1" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<label>
							<span>Second charge <span class="unit">(C)</span></span>
							<input type="text" name="charge2" autocomplete="off" autocapitalize="off" spellcheck="false" required>
						</label>
						<button type="submit">Submit</button>
					</form>
						<div id="result" role="status" aria-label="Result"></div>
					</div>
				</section>
			</div>
		</main>
	</body>
</html>
